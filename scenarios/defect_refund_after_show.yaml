  - {name: fan-2, role: fan, config: {show: concert, buy_at: 4.0, arrive_at: 45.0, balance_cents: 12000}}
  - {name: greedy, role: cheat_fan, config: {show: concert, buy_at: 5.0, trick: refund_twice, cheat_at: 18.0, target_ticket: concert-t4, arrive_at: 45.0, balance_cents: 12000}}
faults: []
